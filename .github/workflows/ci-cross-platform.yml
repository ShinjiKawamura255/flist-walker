name: CI Cross Platform

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_LLVM_COV_VERSION: 0.8.7

jobs:
  detect-changes:
    name: Detect Cargo Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cargo_changed: ${{ steps.changes.outputs.cargo_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect audit-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            echo "cargo_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)Cargo\.(toml|lock)$|^rust/\.cargo/audit\.toml$|^\.github/workflows/ci-cross-platform\.yml$|^\.github/workflows/security-audit\.yml$|^scripts/check_ci_policy\.py$|^scripts/tests/test_check_ci_policy\.py$'; then
            echo "cargo_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_changed=false" >> "$GITHUB_OUTPUT"
          fi

  ci-policy:
    name: CI Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate CI policy
        run: python -m unittest scripts.tests.test_check_ci_policy

  rust-test-build:
    name: Rust Test and Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked
          - os: macos-26
            label: macos-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked
          - os: windows-2025-vs2026
            label: windows-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked
          - os: ubuntu-24.04
            label: windows-gnu-cross
            workdir: .
            target: x86_64-pc-windows-gnu
            run_tests: false
            build_cmd: ./scripts/build-rust-win.sh --locked

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        if: ${{ !matrix.target }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install Rust with target
        if: ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.label }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Install mingw-w64
        if: ${{ matrix.target }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Run tests
        if: ${{ matrix.run_tests }}
        working-directory: ${{ matrix.workdir }}
        run: cargo test --locked

      - name: Run lightweight perf gate
        if: ${{ matrix.label == 'linux-native' }}
        working-directory: rust
        run: cargo test perf_filelist_stream_is_faster_than_metadata_probe_baseline --lib -- --ignored --nocapture

      - name: Build release
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.build_cmd }}

  cargo-audit:
    name: Cargo Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cargo_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Run cargo audit
        run: cargo audit

  lint-and-coverage:
    name: Clippy and Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust with clippy and llvm tools
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1
          components: clippy, llvm-tools-preview

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked --force

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Prepare coverage output directory
        run: mkdir -p target/llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --lcov --output-path target/llvm-cov/lcov.info --fail-under-lines 75

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: rust/target/llvm-cov/lcov.info

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - detect-changes
      - ci-policy
      - rust-test-build
      - cargo-audit
      - lint-and-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required results
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          POLICY_RESULT: ${{ needs.ci-policy.result }}
          TEST_RESULT: ${{ needs.rust-test-build.result }}
          LINT_RESULT: ${{ needs.lint-and-coverage.result }}
          AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          CARGO_CHANGED: ${{ needs.detect-changes.outputs.cargo_changed }}
        run: |
          set -euo pipefail
          [[ "$DETECT_RESULT" == "success" ]]
          [[ "$POLICY_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$LINT_RESULT" == "success" ]]
          if [[ "$CARGO_CHANGED" == "true" ]]; then
            [[ "$AUDIT_RESULT" == "success" ]]
          else
            [[ "$CARGO_CHANGED" == "false" ]]
            [[ "$AUDIT_RESULT" == "skipped" ]]
          fi
