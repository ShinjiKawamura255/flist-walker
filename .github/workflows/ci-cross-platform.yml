name: CI Cross Platform

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_LLVM_COV_VERSION: 0.8.7

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cargo_changed: ${{ steps.changes.outputs.cargo_changed }}
      heavy_ci_required: ${{ steps.changes.outputs.heavy_ci_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify changes fail closed
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          heavy_ci_required=true
          cargo_changed=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            echo "heavy_ci_required=$heavy_ci_required" >> "$GITHUB_OUTPUT"
            echo "cargo_changed=$cargo_changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_rows="$(git diff --name-status "$base_sha" "$GITHUB_SHA")" ||
             ! changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"; then
            echo "heavy_ci_required=$heavy_ci_required" >> "$GITHUB_OUTPUT"
            echo "cargo_changed=$cargo_changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed_rows"
          printf '%s\n' "$changed_files"
          readonly DOCS_ONLY_RE='^(docs/.*|README\.md|README-ja\.md|CHANGELOG\.md|AGENTS\.md|LICENSE|THIRD_PARTY_NOTICES\.txt|\.github/ISSUE_TEMPLATE/.*|\.github/release-template\.md)$'
          docs_only=true
          if [[ -z "$changed_rows" ]]; then
            docs_only=false
          fi
          while IFS=$'\t' read -r status path extra; do
            if [[ "$status" != "A" && "$status" != "M" ]] ||
               [[ -n "$extra" ]] || [[ ! "$path" =~ $DOCS_ONLY_RE ]]; then
              docs_only=false
            fi
          done <<< "$changed_rows"
          if [[ "$docs_only" == "true" ]]; then
            heavy_ci_required=false
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)Cargo\.(toml|lock)$|^rust/\.cargo/audit\.toml$|^\.github/workflows/ci-cross-platform\.yml$|^\.github/workflows/security-audit\.yml$|^scripts/check_ci_policy\.py$|^scripts/tests/test_check_ci_policy\.py$'; then
            cargo_changed=true
          else
            cargo_changed=false
          fi
          echo "heavy_ci_required=$heavy_ci_required" >> "$GITHUB_OUTPUT"
          echo "cargo_changed=$cargo_changed" >> "$GITHUB_OUTPUT"

  ci-policy:
    name: CI Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate CI policy
        run: python -m unittest scripts.tests.test_check_ci_policy

  rust-test-build:
    name: Rust Test and Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.heavy_ci_required == 'true' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked
          - os: macos-26
            label: macos-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked
          - os: windows-2025-vs2026
            label: windows-native
            workdir: rust
            run_tests: true
            build_cmd: cargo build --release --locked

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.label }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Run tests
        if: ${{ matrix.run_tests }}
        working-directory: ${{ matrix.workdir }}
        run: cargo test --locked

      - name: Run platform clippy
        if: ${{ matrix.label != 'linux-native' }}
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run lightweight perf gate
        if: ${{ matrix.label == 'linux-native' }}
        working-directory: rust
        run: cargo test perf_filelist_stream_is_faster_than_metadata_probe_baseline --lib -- --ignored --nocapture

      - name: Build release
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.build_cmd }}

  windows-gnu-updater-build:
    name: Windows GNU Updater Build
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.heavy_ci_required == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-windows-gnu-updater-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Install mingw-w64
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build updater test channel
        shell: bash
        env:
          FLISTWALKER_UPDATE_PUBLIC_KEY_HEX: 79b5562e8fe654f94078b112e8a98ba7901f853ae695bed7e0e3910bad049664
          FLISTWALKER_UPDATE_TEST_CHANNEL: 1
        run: ./scripts/build-rust-win.sh --locked

      - name: Upload Windows GNU test-channel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-gnu-updater-test-channel
          path: |
            rust/target/x86_64-pc-windows-gnu/release/FlistWalker.exe
            rust/target/x86_64-pc-windows-gnu/release/fw.exe
          if-no-files-found: error

  windows-gnu-update-e2e:
    name: Windows GNU Updater E2E
    needs: [detect-changes, windows-gnu-updater-build]
    if: ${{ needs.detect-changes.outputs.heavy_ci_required == 'true' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: pwsh
        run: |
          "runner_image_os=$env:ImageOS" >> $env:GITHUB_STEP_SUMMARY
          "runner_image_version=$env:ImageVersion" >> $env:GITHUB_STEP_SUMMARY

      - name: Install Rust for manifest signer
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Download Windows GNU test-channel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-gnu-updater-test-channel
          path: updater-test-artifact

      - name: Execute sandbox self-update
        shell: pwsh
        env:
          FLISTWALKER_UPDATE_PUBLIC_KEY_HEX: 79b5562e8fe654f94078b112e8a98ba7901f853ae695bed7e0e3910bad049664
          FLISTWALKER_UPDATE_SIGNING_KEY_HEX: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
        run: |
          $callerSigningKey = $env:FLISTWALKER_UPDATE_SIGNING_KEY_HEX
          if ([string]::IsNullOrWhiteSpace($callerSigningKey)) { throw 'test signing key is missing before updater variants' }
          foreach ($case in @(
            @{ Variant = 'Universal'; File = 'FlistWalker.exe'; Marker = 'FLISTWALKER_UPDATE_E2E_PAYLOAD_Universal_V1' },
            @{ Variant = 'Fw'; File = 'fw.exe'; Marker = 'FLISTWALKER_UPDATE_E2E_PAYLOAD_Fw_V1' }
          )) {
            $artifact = (Resolve-Path -LiteralPath (Join-Path 'updater-test-artifact' $case.File)).Path
            $updatePayload = Join-Path $env:RUNNER_TEMP ($case.Variant + '-update-payload.exe')
            Copy-Item -LiteralPath $artifact -Destination $updatePayload
            $overlay = [System.Text.Encoding]::ASCII.GetBytes($case.Marker)
            $stream = [System.IO.File]::Open($updatePayload, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try { $stream.Write($overlay, 0, $overlay.Length); $stream.Flush($true) } finally { $stream.Dispose() }
            & ./scripts/manual-self-update-test.ps1 -Variant $case.Variant -AppPath $artifact -UpdateBinaryPath $updatePayload -Mode SameVersion -Automated -CleanupSandbox
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:FLISTWALKER_UPDATE_SIGNING_KEY_HEX -cne $callerSigningKey) { throw "$($case.Variant) updater test mutated the caller signing key" }
          }

  cargo-audit:
    name: Cargo Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cargo_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Run cargo audit
        run: cargo audit

  lint-and-coverage:
    name: Clippy and Coverage
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.heavy_ci_required == 'true' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust with clippy and llvm tools
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1
          components: clippy, llvm-tools-preview

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-lint-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked --force

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Prepare coverage output directory
        run: mkdir -p target/llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --lcov --output-path target/llvm-cov/lcov.info --fail-under-lines 75

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: rust/target/llvm-cov/lcov.info

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - detect-changes
      - ci-policy
      - rust-test-build
      - windows-gnu-updater-build
      - windows-gnu-update-e2e
      - cargo-audit
      - lint-and-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required results
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          POLICY_RESULT: ${{ needs.ci-policy.result }}
          TEST_RESULT: ${{ needs.rust-test-build.result }}
          WINDOWS_GNU_BUILD_RESULT: ${{ needs.windows-gnu-updater-build.result }}
          WINDOWS_GNU_UPDATE_RESULT: ${{ needs.windows-gnu-update-e2e.result }}
          LINT_RESULT: ${{ needs.lint-and-coverage.result }}
          AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          CARGO_CHANGED: ${{ needs.detect-changes.outputs.cargo_changed }}
          HEAVY_CI_REQUIRED: ${{ needs.detect-changes.outputs.heavy_ci_required }}
        run: |
          set -euo pipefail
          [[ "$DETECT_RESULT" == "success" ]]
          [[ "$POLICY_RESULT" == "success" ]]
          if [[ "$HEAVY_CI_REQUIRED" == "true" ]]; then
            [[ "$TEST_RESULT" == "success" ]]
            [[ "$WINDOWS_GNU_BUILD_RESULT" == "success" ]]
            [[ "$WINDOWS_GNU_UPDATE_RESULT" == "success" ]]
            [[ "$LINT_RESULT" == "success" ]]
          else
            [[ "$HEAVY_CI_REQUIRED" == "false" ]]
            [[ "$TEST_RESULT" == "skipped" ]]
            [[ "$WINDOWS_GNU_BUILD_RESULT" == "skipped" ]]
            [[ "$WINDOWS_GNU_UPDATE_RESULT" == "skipped" ]]
            [[ "$LINT_RESULT" == "skipped" ]]
          fi
          if [[ "$CARGO_CHANGED" == "true" ]]; then
            [[ "$AUDIT_RESULT" == "success" ]]
          else
            [[ "$CARGO_CHANGED" == "false" ]]
            [[ "$AUDIT_RESULT" == "skipped" ]]
          fi
