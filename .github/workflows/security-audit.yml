name: Scheduled Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  audit:
    name: Scheduled Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Run cargo audit
        run: cargo audit

  report-failure:
    name: Track Security Audit Failure
    needs: audit
    if: ${{ failure() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update security issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[security] Scheduled cargo audit failed"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --limit 100 --json number,title,author --jq "[.[] | select(.title == \"$TITLE\" and .author.login == \"app/github-actions\")] | first | .number // empty")"
          body="Scheduled cargo audit failed: $RUN_URL. Triage within 24 hours; an advisory, database/tool failure, or accepted-risk change may require an immediate candidate PR."
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

  resolve-recovered-issue:
    name: Resolve Recovered Security Audit Issue
    needs: audit
    if: ${{ success() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Close recovered security issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[security] Scheduled cargo audit failed"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --limit 100 --json number,title,author --jq "[.[] | select(.title == \"$TITLE\" and .author.login == \"app/github-actions\")] | first | .number // empty")"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Recovered: $RUN_URL"
          fi
