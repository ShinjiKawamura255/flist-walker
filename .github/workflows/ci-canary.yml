name: CI Latest Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  latest-compatibility:
    name: Latest Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: stable
          components: clippy

      - name: Run tests
        working-directory: rust
        run: cargo test --locked

      - name: Run clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings

  report-failure:
    name: Track Canary Failure
    needs: latest-compatibility
    if: ${{ failure() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update canary issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[ci-canary] Latest environment compatibility failed"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --limit 100 --json number,title,author --jq "[.[] | select(.title == \"$TITLE\" and .author.login == \"app/github-actions\")] | first | .number // empty")"
          body="Canary failed: $RUN_URL. Triage within seven days and decide whether to promote a new runner generation, Rust version, action, or CI tool pin."
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

  resolve-recovered-issue:
    name: Resolve Recovered Canary Issue
    needs: latest-compatibility
    if: ${{ success() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Close recovered canary issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[ci-canary] Latest environment compatibility failed"
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --limit 100 --json number,title,author --jq "[.[] | select(.title == \"$TITLE\" and .author.login == \"app/github-actions\")] | first | .number // empty")"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Recovered: $RUN_URL"
          fi
