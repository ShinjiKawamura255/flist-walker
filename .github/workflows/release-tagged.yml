name: Release Tagged Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  release-context:
    name: Resolve Release Context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve and validate version
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo "candidate workflow must run from default branch $DEFAULT_BRANCH" >&2
              exit 1
            fi
            requested_tag="$INPUT_VERSION"
          else
            requested_tag="$REF_NAME"
          fi
          if [[ ! "$requested_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match vX.Y.Z: $requested_tag" >&2
            exit 1
          fi
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          if [[ "$cargo_version" != "${requested_tag#v}" ]]; then
            echo "Cargo version $cargo_version does not match $requested_tag" >&2
            exit 1
          fi
          echo "tag=$requested_tag" >> "$GITHUB_OUTPUT"
          echo "version=${requested_tag#v}" >> "$GITHUB_OUTPUT"

  release-preflight:
    name: Release Preflight (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: release-context
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-native
            workdir: rust
          - os: macos-26
            label: macos-native
            workdir: rust
          - os: windows-2025-vs2026
            label: windows-native
            workdir: rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-release-preflight-${{ matrix.label }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: cargo test --locked

      - name: Run clippy
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

  release-cargo-audit:
    name: Release Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: release-context
    defaults:
      run:
        shell: bash
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        working-directory: .
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Run cargo audit
        run: cargo audit

  build-release-assets:
    name: Build Release Assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - release-context
      - release-preflight
      - release-cargo-audit
    env:
      FLISTWALKER_UPDATE_PUBLIC_KEY_HEX: ${{ secrets.FLISTWALKER_UPDATE_PUBLIC_KEY_HEX }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: windows-x86_64
            artifact_name: release-windows-x86_64
            target: x86_64-pc-windows-gnu
            upload_paths: |
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-windows-x86_64.exe
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-windows-x86_64.zip
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-windows-x86_64.README.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-windows-x86_64.LICENSE.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-windows-x86_64.THIRD_PARTY_NOTICES.txt
              dist/${{ needs.release-context.outputs.tag }}/fw-*-windows-x86_64.exe
              dist/${{ needs.release-context.outputs.tag }}/SHA256SUMS
          - os: ubuntu-24.04
            label: linux-x86_64
            artifact_name: release-linux-x86_64
            upload_paths: |
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-linux-x86_64
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-linux-x86_64.tar.gz
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-linux-x86_64.README.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-linux-x86_64.LICENSE.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-linux-x86_64.THIRD_PARTY_NOTICES.txt
              dist/${{ needs.release-context.outputs.tag }}/fw-*-linux-x86_64
              dist/${{ needs.release-context.outputs.tag }}/SHA256SUMS
          - os: macos-26-intel
            label: macos-x86_64
            artifact_name: release-macos-x86_64
            target: x86_64-apple-darwin
            upload_paths: |
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64-app.zip
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64.tar.gz
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64.README.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64.LICENSE.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-x86_64.THIRD_PARTY_NOTICES.txt
              dist/${{ needs.release-context.outputs.tag }}/fw-*-macos-x86_64
              dist/${{ needs.release-context.outputs.tag }}/SHA256SUMS
          - os: macos-26
            label: macos-arm64
            artifact_name: release-macos-arm64
            target: aarch64-apple-darwin
            upload_paths: |
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64-app.zip
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64.tar.gz
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64.README.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64.LICENSE.txt
              dist/${{ needs.release-context.outputs.tag }}/FlistWalker-*-macos-arm64.THIRD_PARTY_NOTICES.txt
              dist/${{ needs.release-context.outputs.tag }}/fw-*-macos-arm64
              dist/${{ needs.release-context.outputs.tag }}/SHA256SUMS

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        if: ${{ !matrix.target }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Install Rust with target
        if: ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-release-build-${{ matrix.label }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Install mingw-w64
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build Windows release
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: ./scripts/build-rust-win.sh --locked

      - name: Package Windows release assets
        if: ${{ matrix.label == 'windows-x86_64' }}
        shell: bash
        run: ./scripts/prepare-release.sh "${{ needs.release-context.outputs.tag }}"

      - name: Build Linux release
        if: ${{ matrix.label == 'linux-x86_64' }}
        shell: bash
        working-directory: rust
        run: cargo build --release --locked

      - name: Package Linux release assets
        if: ${{ matrix.label == 'linux-x86_64' }}
        shell: bash
        run: ./scripts/prepare-release-linux.sh "${{ needs.release-context.outputs.tag }}"

      - name: Build macOS release
        if: ${{ matrix.label == 'macos-x86_64' || matrix.label == 'macos-arm64' }}
        shell: bash
        run: ./scripts/build-rust-macos.sh "${{ matrix.target }}"

      - name: Package macOS release assets
        if: ${{ matrix.label == 'macos-x86_64' || matrix.label == 'macos-arm64' }}
        shell: bash
        run: ./scripts/prepare-release-macos.sh "${{ needs.release-context.outputs.tag }}" "${{ matrix.target }}"

      - name: Upload packaged assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_paths }}
          if-no-files-found: error

  assemble-release-bundle:
    name: Assemble Release Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - release-context
      - build-release-assets

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action branch
        with:
          toolchain: 1.97.1

      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets

      - name: Show downloaded assets
        shell: bash
        run: find release-assets -maxdepth 3 -type f | sort

      - name: Collect release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          find release-assets -type f -name 'FlistWalker-*' -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-bundle/$(basename "$file")"
          done
          find release-assets -type f -name 'fw-*' -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-bundle/$(basename "$file")"
          done
          (
            cd release-bundle
            sha256sum * > SHA256SUMS
          )
          ls -la release-bundle

      - name: Sign release checksum manifest
        env:
          FLISTWALKER_UPDATE_PUBLIC_KEY_HEX: ${{ secrets.FLISTWALKER_UPDATE_PUBLIC_KEY_HEX }}
          FLISTWALKER_UPDATE_SIGNING_KEY_HEX: ${{ secrets.FLISTWALKER_UPDATE_SIGNING_KEY_HEX }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path rust/Cargo.toml --quiet --bin sign_update_manifest -- \
            release-bundle/SHA256SUMS release-bundle/SHA256SUMS.sig

      - name: Validate release bundle
        shell: bash
        run: bash ./scripts/validate-release-bundle.sh "${{ needs.release-context.outputs.tag }}" release-bundle

      - name: Validate previous public updater compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          previous_version="${previous_tag#v}"
          candidate_version="${{ needs.release-context.outputs.version }}"
          # Regression guard: the updater that is already installed parses the
          # candidate manifest, so candidate-side fixes cannot justify a bypass.
          python3 ./scripts/check-updater-n-minus-one-compatibility.py \
            --previous-version "$previous_version" \
            --candidate-version "$candidate_version" \
            --manifest release-bundle/SHA256SUMS

      - name: Upload validated candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-bundle-${{ needs.release-context.outputs.tag }}-${{ github.sha }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 14

  create-draft-release:
    name: Create Draft Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - release-context
      - assemble-release-bundle
    permissions:
      contents: write

    steps:
      - name: Record runner image
        shell: bash
        run: |
          echo "runner_image_os=${ImageOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_image_version=${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists for $RELEASE_TAG; refusing to overwrite assets" >&2
            exit 1
          fi

      - name: Download validated candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-bundle-${{ needs.release-context.outputs.tag }}-${{ github.sha }}
          path: release-bundle

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          assets=(release-bundle/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "release-bundle is empty" >&2
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --verify-tag \
            --draft \
            --generate-notes
