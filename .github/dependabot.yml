version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "18:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
      day: monday
      time: "19:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
